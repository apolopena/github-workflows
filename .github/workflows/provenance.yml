name: provenance (reusable)

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
        description: >
          Which GitHub operation to perform.
          Options:
            - open-issue:     Create a new issue
            - issue-comment:  Comment on an existing issue
            - pr-comment:     Comment on an existing pull request
            - pr-code:        Post code content as a PR comment
            - open-pr:        Create a new pull request
            - edit-issue:     Change an issue's title or body
            - edit-pr:        Change a pull request's title or body
            - close-issue:    Close an issue, after an optional comment
            - add-labels:     Add labels to an issue or pull request
            - remove-labels:  Remove labels from an issue or pull request
            - create-label:   Create a label (title is its name, body its description)
      provenance_label:
        required: true
        type: string
        default: "AI Coding Assistant"
        description: >
          Marker identifying the provenance/caller (e.g., "AI Coding Assistant").
          Used for audit and traceability.
      target_repo:
        required: false
        type: string
        description: >
          Repository to operate on in "owner/repo" format.
          Defaults to the caller repository if not provided.
      number:
        required: false
        type: string
        description: >
          Issue or pull request number.
          Required for actions that target an existing issue/PR
          (e.g., issue-comment, pr-comment, pr-code, edit-issue, close-issue, add-labels).
      title:
        required: false
        type: string
        description: >
          Title text for newly opened issues or pull requests
          (used only with open-issue and open-pr).
      body:
        required: false
        type: string
        description: >
          Body text for issues, PRs, or comments.
          Used with open-issue, open-pr, issue-comment, pr-comment, pr-code.
      base:
        required: false
        type: string
        description: >
          Base branch name for new pull requests (e.g., "main").
          Used only with open-pr.
      head:
        required: false
        type: string
        description: >
          Head branch name for new pull requests (source branch).
          Used only with open-pr.
      draft:
        required: false
        type: string
        description: >
          Flag to mark a new pull request as a draft.
          Used only with open-pr.
      labels:
        required: false
        type: string
        description: >
          Comma-separated label names.
          Used with open-issue, add-labels and remove-labels.
      state_reason:
        required: false
        type: string
        description: >
          Why an issue closes: "completed" (the default) or "not_planned".
          Used only with close-issue.
      color:
        required: false
        type: string
        description: >
          Six hex digits without "#", for example "1D76DB".
          Used only with create-label.
      plan_only:
        required: false
        type: boolean
        default: false
        description: >
          Dry-run mode: print which API call would be made without
          actually creating or modifying issues/PRs.
          Applies to all action types.

    secrets:
      PROVENANCE_APP_ID:           { required: true }
      PROVENANCE_APP_PRIVATE_KEY:  { required: true }
      PROVENANCE_INSTALLATION_ID:  { required: true }

  workflow_dispatch:
    inputs:
      action:
        description: "GitHub operation to perform"
        type: choice
        required: true
        options:
          - open-issue
          - issue-comment
          - pr-comment
          - pr-code
          - open-pr
          - edit-issue
          - edit-pr
          - close-issue
          - add-labels
          - remove-labels
          - create-label
      provenance_label:
        description: "e.g., human or AI_CODING_ASSISTANT"
        type: string
        required: true
      target_repo:
        description: "owner/repo (defaults to this repo)"
        type: string
        required: false
      number:
        description: "Issue/PR number for comment actions"
        type: string
        required: false
      title:
        description: "Title for open-issue/open-pr"
        type: string
        required: false
      body:
        description: "Body for issues/comments/PRs"
        type: string
        required: false
      base:
        description: "Base branch for open-pr"
        type: string
        required: false
      head:
        description: "Head (e.g., user:feature-branch) for open-pr"
        type: string
        required: false
      draft:
        description: "true|false for draft PRs"
        type: string
        required: false
      labels:
        description: "Comma-separated labels for open-issue/add-labels/remove-labels"
        type: string
        required: false
      state_reason:
        description: "completed|not_planned for close-issue"
        type: string
        required: false
      color:
        description: "Six hex digits for create-label"
        type: string
        required: false
      plan_only:
        description: "true to dry-run (no changes)"
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Mint installation token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.PROVENANCE_APP_ID }}
          private_key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          installation_retrieval_mode: id
          installation_retrieval_payload: ${{ secrets.PROVENANCE_INSTALLATION_ID }}

      - name: Prepare scripts (defensive)
        run: chmod +x .github/scripts/*.sh

      - name: Plan
        shell: bash
        env:
          ACTION:      ${{ inputs.action }}
          TARGET_REPO: ${{ inputs.target_repo }}
          NUMBER:      ${{ inputs.number }}
          TITLE:       ${{ inputs.title }}
          BASE:        ${{ inputs.base }}
          HEAD:        ${{ inputs.head }}
          LABELS:      ${{ inputs.labels }}
          STATE_REASON: ${{ inputs.state_reason }}
          COLOR:       ${{ inputs.color }}
          PROV_LABEL:  ${{ inputs.provenance_label }}
        run: |
          set -euo pipefail
          REPO="${TARGET_REPO:-${GITHUB_REPOSITORY}}"
          echo "Provenance: ${PROV_LABEL}"
          echo "Action: $ACTION"
          case "$ACTION" in
            open-issue)    echo "POST /repos/$REPO/issues (title='${TITLE:-}')" ;;
            pr-comment)    echo "POST /repos/$REPO/issues/${NUMBER:-?}/comments" ;;
            issue-comment) echo "POST /repos/$REPO/issues/${NUMBER:-?}/comments" ;;
            pr-code)       echo "POST (code) /repos/$REPO/issues/${NUMBER:-?}/comments" ;;
            open-pr)       echo "POST /repos/$REPO/pulls (base='${BASE:-}', head='${HEAD:-}', title='${TITLE:-}')" ;;
            edit-issue)    echo "PATCH /repos/$REPO/issues/${NUMBER:-?}" ;;
            edit-pr)       echo "PATCH /repos/$REPO/pulls/${NUMBER:-?}" ;;
            close-issue)   echo "PATCH /repos/$REPO/issues/${NUMBER:-?} (state=closed, reason='${STATE_REASON:-completed}')" ;;
            add-labels)    echo "POST /repos/$REPO/issues/${NUMBER:-?}/labels (labels='${LABELS:-}')" ;;
            remove-labels) echo "DELETE /repos/$REPO/issues/${NUMBER:-?}/labels/<each> (labels='${LABELS:-}')" ;;
            create-label)  echo "POST /repos/$REPO/labels (name='${TITLE:-}', color='${COLOR:-}')" ;;
            *)             echo "Unknown action: $ACTION"; exit 1 ;;
          esac

      - name: Stop on plan_only
        if: ${{ inputs.plan_only == true }}
        run: echo "Dry run (plan_only=true). No changes made."

      - name: Sanity check
        if: ${{ inputs.plan_only != true }}
        shell: bash
        env:
          TOKEN:      ${{ steps.app-token.outputs.token }}
          REPO:       ${{ inputs.target_repo }}
          PROV_LABEL: ${{ inputs.provenance_label }}
        run: .github/scripts/sanity.sh

      - name: Dispatch action
        if: ${{ inputs.plan_only != true }}
        shell: bash
        env:
          TOKEN:      ${{ steps.app-token.outputs.token }}
          REPO:       ${{ inputs.target_repo }}
          ACT:        ${{ inputs.action }}
          NUM:        ${{ inputs.number }}
          TITLE:      ${{ inputs.title }}
          BODY:       ${{ inputs.body }}
          BASE:       ${{ inputs.base }}
          HEAD:       ${{ inputs.head }}
          DRAFT:      ${{ inputs.draft }}
          LABELS:     ${{ inputs.labels }}
          STATE_REASON: ${{ inputs.state_reason }}
          COLOR:      ${{ inputs.color }}
          ACTOR:      ${{ github.actor }}
          PROV_LABEL: ${{ inputs.provenance_label }}
        run: .github/scripts/dispatch_action.sh
